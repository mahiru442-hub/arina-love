<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12080f">
<title>Для Арины ❤️</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#12080f}
body{position:fixed;inset:0;overscroll-behavior:none}
iframe{display:block;border:0;width:100%;height:100vh;height:100dvh;background:#12080f}
</style>
</head>
<body>
<iframe id="app" src="./index.html.html?v=mobilefix-20260920-2" title="Для Арины" allow="autoplay; fullscreen" allowfullscreen></iframe>
<script>
(function(){
  var frame=document.getElementById("app");
  var completed=false;
  var finishTimer=0;

  history.replaceState(null,"",location.pathname+location.search);

  function installFix(){
    var w,d,intro,site,envelope;
    try{
      w=frame.contentWindow;
      d=w.document;
      intro=d.getElementById("intro");
      site=d.getElementById("site");
      envelope=d.getElementById("envelope");
    }catch(e){ return; }

    if(!d||!intro||!site||!envelope) return;

    if(!d.getElementById("mobile-intro-lock-style")){
      var style=d.createElement("style");
      style.id="mobile-intro-lock-style";
      style.textContent=
        "html.intro-complete .intro,.intro.intro-complete{opacity:0!important;visibility:hidden!important;pointer-events:none!important;animation:none!important}"+
        "html.intro-complete .site,.site.intro-complete{opacity:1!important;transform:none!important;visibility:visible!important;animation:none!important}";
      d.head.appendChild(style);
    }

    function keepDone(){
      if(!completed) return;
      d.documentElement.classList.add("intro-complete");
      intro.classList.add("intro-complete");
      site.classList.add("intro-complete");
    }

    function finish(){
      if(completed){ keepDone(); return; }
      completed=true;
      clearTimeout(finishTimer);
      keepDone();
      try{
        if(w.location.hash==="#intro"){
          w.history.replaceState(w.history.state,"",w.location.pathname+w.location.search);
        }
      }catch(e){}
    }

    function arm(){
      if(completed) return;
      clearTimeout(finishTimer);
      finishTimer=setTimeout(finish,21600);
    }

    if(!d.documentElement.dataset.mobileIntroFix){
      d.documentElement.dataset.mobileIntroFix="1";

      envelope.addEventListener("click",arm,{capture:true,passive:true});

      intro.addEventListener("animationend",function(e){
        if(e.animationName==="cssIntroAway" || /IntroAway/i.test(e.animationName)){
          finish();
        }
      });

      w.addEventListener("hashchange",function(){
        if(w.location.hash==="#intro" && !completed) arm();
        else if(completed) keepDone();
      });

      w.addEventListener("pageshow",keepDone);
      w.addEventListener("resize",keepDone,{passive:true});
    }

    if(completed) keepDone();
    else {
      try{ if(w.location.hash==="#intro") arm(); }catch(e){}
    }
  }

  frame.addEventListener("load",installFix);
  window.addEventListener("pageshow",installFix);
  window.addEventListener("resize",function(){
    if(completed) installFix();
  },{passive:true});
})();
</script>
</body>
</html>
